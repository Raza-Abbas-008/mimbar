name: mimbar
description: "Offline scheduler for majalis, milad and nikkah."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.7

dependencies:
  connectivity_plus: ^7.3.2
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  flutter_timezone: ^5.1.1
  gal: ^2.3.3
  hijri: ^3.0.1
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.5
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  fonts:
    - family: Nastaliq
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
